<style>
:root{
  /* дизайн-система 15.10.2026: значения ниже заменяют прежние */
  --font:"Commissioner",sans-serif;
  --font-head:"Jost",sans-serif;
  --bg:#121416;
  --bg2:#121416;
  --fg:#eef1f2;
  --mute:rgba(238,241,242,.62);
  --line:rgba(238,241,242,.12);
  --glass:rgba(18,20,22,.8);
  --tile:rgba(238,241,242,.07);

  /* Новые переменные */
  --accent:#eef1f2;
  --accent-h:#c9cfd3;
  --on-accent:#121416;
  /* общее из шаблона */
  --gut:clamp(16px,3.4vw,48px); --wrap:1240px; --h1:clamp(46px,5.7vw,84px); --h2:calc(var(--h1) * .75); --sec:clamp(76px,9vw,136px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p,figure,blockquote,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
.nb{white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.sec{padding:var(--sec) 0}
.h2{font:500 var(--h2)/1 var(--font);letter-spacing:-.03em}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 48px}
.note{color:var(--mute);font-size:16px;line-height:1.45;max-width:40ch}
.ico{width:16px;height:16px;flex:none}

/* кнопки: наведение, нажатие, фокус */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:6px;border:1px solid transparent;
  font:600 17px/1 var(--font);letter-spacing:.005em;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .18s,color .18s,border-color .18s,transform .12s}
.btn svg{width:19px;height:19px;flex:none;transition:transform .2s cubic-bezier(.16,1,.3,1)}
.btn-main{background:var(--fg);color:#111214}
.btn-ghost{background:rgba(244,245,246,.06);color:var(--fg);border-color:rgba(244,245,246,.3)}
@media (hover:hover){
  .btn-main:hover{background:#d3d7da}
  .btn-main:hover svg{transform:translateX(4px)}
  .btn-ghost:hover{background:rgba(244,245,246,.14);border-color:rgba(244,245,246,.6)}
}
.btn:active{transform:translateY(1px)}
.btn-main:active{background:#b9bec2}
.btn-ghost:active{background:rgba(244,245,246,.2)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.link{text-decoration:none;border-bottom:1px solid rgba(244,245,246,.4);padding-bottom:1px;transition:border-color .15s}
@media (hover:hover){.link:hover{border-color:var(--fg)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}

.demo{background:#000;color:#8b9094;font-size:12px;text-align:center;padding:5px 16px}

/* ПЕРВЫЙ ЭКРАН — схема Porem: фото зала на весь экран, слева название и факты, справа карточка записи */
.hero{position:relative;min-height:max(680px,calc(100svh - 26px));display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:settle 1.8s cubic-bezier(.16,1,.3,1) both}
.hero-bg picture{display:block;width:100%;height:100%}
@keyframes settle{from{transform:scale(1.05)}to{transform:none}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(11,12,14,.84) 0,rgba(11,12,14,.6) 44%,rgba(11,12,14,.3) 100%),linear-gradient(180deg,rgba(11,12,14,.5) 0,rgba(11,12,14,0) 24%,rgba(11,12,14,0) 72%,rgba(11,12,14,.55) 100%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:18px;padding-bottom:18px;width:100%}
.logo img{height:52px;width:auto}
.top nav{display:flex;gap:30px;font-size:15px;color:#d9dcde}
.top nav a{text-decoration:none;padding:4px 0;border-bottom:1px solid transparent;transition:border-color .15s,color .15s}
@media (hover:hover){.top nav a:hover{color:var(--fg);border-color:var(--fg)}}
.top-r{display:flex;align-items:center;gap:22px}
.tel{font-weight:500;font-size:16px;text-decoration:none;white-space:nowrap}
@media (hover:hover){.tel:hover{text-decoration:underline;text-underline-offset:4px}}
.top .btn{min-height:44px;padding:0 20px;font-size:15px}

.hero-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:clamp(32px,5vw,80px);align-items:center;width:100%;padding-top:clamp(24px,4vh,56px);padding-bottom:clamp(40px,7vh,88px)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(19,20,23,.62);border:1px solid rgba(244,245,246,.16);font-size:14px;color:#d9dcde;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill b{color:var(--fg);font-weight:600}
.stars{display:inline-flex;gap:2px;color:var(--fg)}
.stars svg{width:13px;height:13px}
a.pill{transition:background-color .15s,border-color .15s}
@media (hover:hover){a.pill:hover{background:rgba(40,42,46,.8);border-color:rgba(244,245,246,.4)}}
.hero h1{font:300 var(--h1)/1.02 var(--font);letter-spacing:-.035em;margin-top:28px}
.hero h1 span{display:block}
.addr-line{display:flex;align-items:center;gap:8px;font-size:clamp(17px,1.45vw,20px);color:#eceef0;margin-top:22px}
.addr-line .ico{width:18px;height:18px;flex:none}
.lead{font-size:clamp(16px,1.3vw,18px);line-height:1.55;color:#c9cdd0;margin-top:8px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chips li{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(19,20,23,.55);border:1px solid rgba(244,245,246,.13);font-size:14px;color:#dfe2e4}
.chips svg{width:16px;height:16px;color:var(--fg)}

.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(244,245,246,.1);border-radius:18px;padding:26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.card h2{font:600 22px/1.2 var(--font);letter-spacing:-.01em}
.card-top span{font-size:13px;color:var(--mute);white-space:nowrap}
.card-top span.on{color:#dfe2e4}
.lbl{font-size:13px;color:var(--mute);margin:20px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:100px;padding:14px;border-radius:10px;background:rgba(244,245,246,.05)}
.tile span{line-height:1.25}
.tile b{font-weight:600;font-size:15px;line-height:1.25}
.tile small{display:block;font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.3}
.tile i{font-style:normal;font-weight:600;font-size:19px;letter-spacing:-.01em}
.card .btn-main{width:100%;margin-top:16px;min-height:58px;font-size:17px}
.fine{display:block;font-size:13px;color:var(--mute);margin-top:12px;text-align:center;line-height:1.45;text-wrap:balance}
.fine .ico{display:inline-block;vertical-align:-2px;margin-right:6px}
.fine a{color:#dfe2e4;font-weight:500}
.fine + .fine{margin-top:6px}

/* ОТЗЫВЫ: белые карточки поверх размытого фото зала */
.reviews{position:relative;overflow:hidden;isolation:isolate}
.reviews{background:var(--bg2)}
.c{text-align:center}
.reviews .h2 span{white-space:nowrap}
.reviews .sub{color:#c9cdd0;font-size:16px;margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(40px,4.4vw,60px)}
.rcard{background:#fff;color:#1a1b1d;border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.rcard blockquote{font-size:19px;line-height:1.45;letter-spacing:-.005em}
.rcard figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid #e8e9ea;font-size:13.5px;color:#64686c}
.rcard figcaption b{font-weight:600;color:#1a1b1d}
.reviews .row{justify-content:center;margin-top:clamp(32px,3.4vw,44px)}

/* РАБОТЫ: от края до края, без рамок */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:clamp(40px,4.4vw,60px)}
.strip figure{min-width:0}
.strip .ph{aspect-ratio:3/4;overflow:hidden;background:#1e1f22}
.strip img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,1,.3,1)}
@media (hover:hover){.strip figure:hover img{transform:scale(1.03)}}
.strip figcaption{padding:14px 16px 0;font-size:15px;color:var(--mute)}
.strip figcaption b{color:var(--fg);font-weight:500}
.strip figcaption .nb{white-space:nowrap}
.after{margin-top:clamp(36px,4vw,52px)}

/* ЦЕНЫ */
.prices{background:var(--bg2)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(32px,5vw,88px);margin-top:clamp(40px,4.4vw,60px);border-top:1px solid var(--line)}
.plist li{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.plist .n{font-weight:500;font-size:clamp(17px,1.45vw,20px);line-height:1.3}
.plist .n small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:3px}
.plist .p{font-weight:500;font-size:clamp(20px,1.8vw,26px);letter-spacing:-.015em;white-space:nowrap}
.call{font-size:16px;color:var(--mute)}
.call a{color:var(--fg);font-weight:500}

/* МАСТЕРА и ПАПА + СЫН: фото на половину ширины от края */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split .ph{overflow:hidden;background:#1e1f22;min-height:100%}
.split .ph img{width:100%;height:100%;object-fit:cover}
.split .txt{padding:var(--sec) var(--gut);max-width:680px}
.split.rev .txt{justify-self:end}
.names{margin-top:clamp(32px,3.4vw,48px);border-top:1px solid var(--line)}
.names li{padding:22px 0;border-bottom:1px solid var(--line)}
.names h3{font:500 clamp(24px,2.2vw,32px)/1.1 var(--font);letter-spacing:-.02em}
.names h3 small{font-size:15px;font-weight:400;color:var(--mute);letter-spacing:0;margin-left:10px}
.names p{font-size:19px;line-height:1.4;margin-top:10px;color:#dfe2e4}
.names p small{display:block;font-size:13.5px;color:var(--mute);margin-top:4px}
.also{margin-top:22px;color:var(--mute);max-width:44ch}
.split .row{margin-top:clamp(30px,3.2vw,44px)}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;margin-top:clamp(28px,3vw,40px)}
.big b{font:300 clamp(52px,5.4vw,80px)/.95 var(--font);letter-spacing:-.04em}
.big span{color:#c9cdd0;font-size:17px}
.kids{margin-top:26px;border-top:1px solid var(--line)}
.kids li{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:17px}
.kids li b{font-weight:500;white-space:nowrap}
.split .p{font-size:18px;line-height:1.55;color:#d0d3d6;margin-top:24px;max-width:42ch}

/* КРОМЕ СТРИЖКИ */
.xlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(28px,4vw,64px);margin-top:clamp(40px,4.4vw,60px)}
.xlist li{padding:22px 0;border-top:1px solid var(--line)}
.xlist h3{font-weight:500;font-size:clamp(19px,1.6vw,22px);line-height:1.25;letter-spacing:-.01em}
.xlist p{color:var(--mute);margin-top:6px;font-size:15.5px;line-height:1.45}

/* КАК НАЙТИ */
.where{background:var(--bg)}
.addr{font:300 clamp(30px,3.8vw,54px)/1.08 var(--font);letter-spacing:-.03em;margin-top:clamp(28px,3vw,40px);max-width:20ch}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(28px,4vw,64px);margin-top:clamp(36px,4vw,56px)}
.wgrid > div{padding:22px 0;border-top:1px solid var(--line)}
.wgrid h3{font-size:14px;font-weight:400;color:var(--mute)}
.wgrid p{font-size:18px;line-height:1.45;margin-top:8px}
.wgrid p small{display:block;color:var(--mute);font-size:14.5px;margin-top:6px}
.where .row{margin-top:clamp(34px,3.6vw,48px)}
.soc{font-size:16px;color:var(--mute)}

/* ФИНАЛ: снова зал, затемнён */
.final{position:relative;overflow:hidden;isolation:isolate;padding:clamp(96px,12vw,180px) 0}
.final .bgi{position:absolute;inset:0;z-index:-2}
.final .bgi img{width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.final::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(11,12,14,.72)}
.final .p{font-size:19px;color:#d0d3d6;margin:20px auto 0;max-width:38ch}
.final .row{justify-content:center;margin-top:clamp(30px,3.2vw,44px)}
footer{color:#83888c;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding-top:26px;padding-bottom:110px}
footer a{color:#b5b9bc}

/* липкая кнопка на телефоне */
.sticky{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:min(760px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 10px 10px 22px;border-radius:14px;background:rgba(19,20,23,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(244,245,246,.12);box-shadow:0 18px 40px -16px rgba(0,0,0,.85);
  transform:translate(-50%,170%);visibility:hidden;transition:transform .32s cubic-bezier(.16,1,.3,1),visibility .32s}
.sticky.show{transform:translate(-50%,0);visibility:visible}
.sticky .info{font-size:16px;line-height:1.3;min-width:0}
.sticky .info b{font-weight:600}

/* ВОПРОСЫ */
.faq{background:var(--bg2)}

    ext: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
  };
  const book = (label, cls) => `<a class="btn btn-main js-book ${cls||""}" href="${e(S.booking)}" target="_blank" rel="noopener">${e(label)} ${arrow}</a>`;
  const nav = [["#works","Работы"],["#prices","Цены"],["#team","Мастера"],["#reviews","Отзывы"],["#where","Как найти"]];
  const fullName = `${S.kind} «${S.name}»`;

  const hero = `
<section class="hero" id="hero">
  <div class="hero-bg"><picture><source media="(max-width:640px)" srcset="${e(S.hero.srcMobile)}"><img src="${e(S.hero.src)}" alt="${e(S.hero.alt)}" width="1280" height="960" fetchpriority="high"></picture></div>
  <header class="top wrap">
    <a class="logo" href="#hero" aria-label="${e(fullName)}, наверх"><img src="${e(S.logo.src)}" alt="Логотип: ${e(fullName)}" width="${S.logo.w}" height="${S.logo.h}"></a>
    <nav aria-label="Разделы">${nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join("")}</nav>
    <div class="top-r"><a class="tel" href="${e(S.phoneHref)}">${e(S.phone)}</a><a class="btn btn-ghost js-book" href="${e(S.booking)}" target="_blank" rel="noopener">Записаться</a></div>
  </header>
  <div class="hero-grid wrap">
    <div class="hero-copy">
      <div class="pills">
        <a class="pill" href="${e(S.reviewsUrl)}" target="_blank" rel="noopener" aria-label="Рейтинг ${e(S.rating)} на Яндекс Картах, ${e(S.ratingCountText)}"><span class="stars">${star.repeat(5)}</span><b>${e(S.rating)}</b><span>${e(S.ratingCountText)} на Яндекс Картах</span></a>
        <span class="pill">${e(S.badge)}</span>
      </div>
      <h1><span>${e(S.kind)}</span> <span>${e(S.name)}</span></h1>
      <p class="addr-line">${icons.pin}${e(S.city)}, ${e(S.address)}</p>
      <p class="lead">${e(S.lead)}</p>
      <ul class="chips">${S.chips.map(c => `<li>${icons[c.icon]||""}${e(c.text)}</li>`).join("")}</ul>
    </div>
    <aside class="card" aria-labelledby="card-h">
      <div class="card-top"><h2 id="card-h">Запись онлайн</h2><span id="open">${e(S.hours)}</span></div>
      <p class="lbl">Цены</p>
      <div class="tiles">${S.cardServices.map(i => { const s = S.services[i]; return `<div class="tile"><span><b>${e(s.short||s.name)}</b>${(s.tileNote||"") ? `<small>${e(s.tileNote)}</small>` : ""}</span><i>${e(s.price)}</i></div>`; }).join("")}</div>
      ${book("Выбрать время")}
      <p class="fine">${icons.ext}${e(S.bookingNote)}</p>
      <p class="fine">Не хотите онлайн? Позвоните: <a class="nb" href="${e(S.phoneHref)}">${e(S.phone)}</a></p>
    </aside>
  </div>
</section>`;

  const reviews = `
<section class="reviews sec" id="reviews">
  <div class="wrap">
    <h2 class="h2 c rv">${[].concat(S.reviewsTitle).map(t => `<span>${e(t)}</span>`).join(" ")}</h2>
    <p class="sub c rv">${e(S.reviewsSub)}</p>
    <div class="cards">${S.quotes.map(q => `<figure class="rcard rv"><blockquote>«${e(q)}»</blockquote></figure>`).join("")}</div>
    <div class="row rv"><button type="button" class="btn btn-ghost" id="ywBtn" aria-controls="yw" aria-expanded="false">Живые отзывы с Яндекса</button><a class="link" href="${e(S.reviewsUrl)}" target="_blank" rel="noopener">Все отзывы на Яндекс Картах</a></div>
    <div class="yw" id="yw" hidden><button type="button" class="yw-x" id="ywX" aria-label="Закрыть живые отзывы"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="yw-f"></div></div>
  </div>
</section>`;

  const works = `
<section class="works sec" id="works">
  <div class="wrap head"><h2 class="h2 rv">Работы</h2><p class="note rv">${e(S.worksNote)}</p></div>
  <div class="strip" id="gallery">${S.works.map(w => `<figure class="rv"><div class="ph"><img src="${e(w.src)}" alt="${e(w.alt)}" loading="lazy" width="900" height="1200"></div><figcaption>${w.title ? `<b>${e(w.title)}</b>` : ""}${w.price ? ` · <span class="nb">${e(w.price)}</span>` : ""}${w.text ? e(w.text) : ""}</figcaption></figure>`).join("")}</div>
  <div class="wrap after rv">${book("Выбрать мастера и время")}</div>
</section>`;

  const prices = `
<section class="prices sec" id="prices">
  <div class="wrap">
    <div class="head"><h2 class="h2 rv">Цены</h2><p class="note rv">${e(S.pricesNote)}</p></div>
    <ul class="plist">${S.services.map(s => `<li class="rv"><span class="n">${e(s.name)}${s.note ? `<small>${e(s.note)}</small>` : ""}</span><span class="p">${e(s.price)}</span></li>`).join("")}</ul>
    <div class="row after rv">${book("Записаться онлайн")}<p class="call">или по телефону <a class="nb" href="${e(S.phoneHref)}">${e(S.phone)}</a></p></div>
  </div>
</section>`;

  const T = S.team;
  const team = `
<section class="split" id="team">
  <figure class="ph rv"><img src="${e(T.photo.src)}" alt="${e(T.photo.alt)}" loading="lazy" width="900" height="1200" style="object-position:${e(T.photo.pos)}"></figure>
  <div class="txt">
    <h2 class="h2 rv">Мастера</h2>
    <p class="note rv" style="margin-top:18px">${e(T.note)}</p>
    <ul class="names">${T.list.map(m => `<li class="rv"><h3>${e(m.name)}${m.role ? `<small>${e(m.role)}</small>` : ""}</h3>${m.quote ? `<p>«${e(m.quote)}»<small>отзыв на Яндекс Картах</small></p>` : ""}</li>`).join("")}</ul>
    <p class="also rv">${e(T.also)}</p>
    <div class="row rv">${book("Выбрать мастера онлайн")}</div>
  </div>
</section>`;

  const F = S.family;
  const family = `
<section class="split rev" id="sons">
  <div class="txt">
    <h2 class="h2 rv">${e(F.title)}</h2>
    <div class="big rv"><b>${e(F.price)}</b><span>${e(F.priceText)}</span></div>
    <ul class="kids rv">${F.kids.map(k => `<li>${e(k[0])} <b>${e(k[1])}</b></li>`).join("")}</ul>
    <p class="p rv">${e(F.text)}</p>
    <div class="row rv">${book(F.cta)}</div>
  </div>
  <figure class="ph rv"><img src="${e(F.photo.src)}" alt="${e(F.photo.alt)}" loading="lazy" width="900" height="1200" style="object-position:${e(F.photo.pos)}"></figure>
</section>`;

  const extras = `
<section class="extra sec" id="extra">
  <div class="wrap head"><h2 class="h2 rv">Кроме стрижки</h2><p class="note rv">${e(S.extrasNote)}</p></div>
  <div class="strip">${S.extrasPhotos.map(p => `<figure class="rv"><div class="ph"><img src="${e(p.src)}" alt="${e(p.alt)}" loading="lazy"></div><figcaption><b>${e(p.title)}</b>${p.text ? ` · ${e(p.text)}` : ""}</figcaption></figure>`).join("")}</div>
  <div class="wrap"><ul class="xlist">${S.extras.map(x => `<li class="rv"><h3>${e(x[0])}</h3><p>${e(x[1])}</p></li>`).join("")}</ul></div>
</section>`;

  const where = `
<section class="where sec" id="where">
  <div class="wrap">
    <h2 class="h2 rv">Как найти</h2>
    <p class="addr rv">${e(S.addressFull)}</p>
    <div class="wgrid">${S.where.map((w, i) => `<div class="rv"><h3>${e(w[0])}</h3><p>${e(w[1])}${i === S.where.length - 1 ? `<br><a class="link nb" href="${e(S.phoneHref)}">${e(S.phone)}</a>` : ""}${w[2] ? `<small>${e(w[2])}</small>` : ""}</p></div>`).join("")}</div>
    <div class="row rv"><a class="btn btn-ghost" href="${e(S.maps)}" target="_blank" rel="noopener">Построить маршрут</a><p class="soc">${S.links.map(l => `<a class="link" href="${e(l.url)}" target="_blank" rel="noopener">${e(l.label)}</a>`).join(" &nbsp;·&nbsp; ")}</p></div>
  </div>
</section>`;

  const plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const faq = `
<section class="faq sec" id="faq">
  <div class="wrap faq-grid">
    <div><h2 class="h2 rv">Вопросы</h2></div>
    <div class="qa">${S.faq.map(f => `<details class="rv"><summary>${e(f.q)}${plus}</summary><p>${e(f.a)}</p></details>`).join("")}</div>
  </div>
</section>`;

  const final = `
<section class="final">
  <div class="bgi"><img src="${e(S.hero.src)}" alt="" loading="lazy"></div>
  <div class="wrap c">
    <h2 class="h2 rv">${e(S.finalTitle)}</h2>
    <p class="p rv">${e(S.finalText)} Или позвоните: <a class="link nb" href="${e(S.phoneHref)}">${e(S.phone)}</a></p>
    <div class="row rv">${book("Выбрать время")}<a class="btn btn-ghost" href="${e(S.phoneHref)}">Позвонить</a></div>
  </div>
</section>
<footer><div class="wrap"><span>${e(fullName)} · ${e(S.city)}, ${e(S.address)}</span><span>${e(S.source)}</span></div></footer>`;

  document.getElementById("app").innerHTML = hero + reviews + works + prices + team + family + extras + faq + where + final;
  const top = S.services[S.stickyService];
  document.body.insertAdjacentHTML("beforeend", `<div class="sticky" id="sticky" role="region" aria-label="Быстрая запись"><p class="info"><b>${e(top.name)} <span class="nb">${e(top.price)}</span></b><span class="sep"> · </span><span class="st js-status">${e(S.hours)}</span></p><a class="btn btn-main" href="${e(S.booking)}" target="_blank" rel="noopener">Выбрать время ${arrow}</a></div>`);

  // разметка для поисковиков
  const H = (S.hours.match(/(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})/) || []).slice(1);
  const pad = v => String(v).padStart(2, "0");
  const opens = pad(H[0]) + ":" + H[1], closes = pad(H[2]) + ":" + H[3];
  const num = p => Number(String(p).replace(/[^\d]/g, ""));
  const abs = u => new URL(u, S.siteUrl).href;
  const priceNums = S.services.map(x => num(x.price)).filter(Boolean);
  const salonId = S.siteUrl + "#salon";
  const graph = {"@context":"https://schema.org","@graph":[
    {"@type":"HairSalon","@id":salonId,"name":fullName,"url":S.siteUrl,"image":[abs("img/og.jpg"),abs(S.hero.src)],"logo":abs(S.logo.src),
     "telephone":S.phoneHref.replace("tel:",""),"priceRange":Math.min(...priceNums)+"–"+Math.max(...priceNums)+" ₽","currenciesAccepted":"RUB",
     "address":{"@type":"PostalAddress","streetAddress":S.address,"addressLocality":S.city,"addressRegion":S.region,"addressCountry":"RU"},
     "openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"opens":opens,"closes":closes}],
     "aggregateRating":{"@type":"AggregateRating","ratingValue":S.ratingValue,"ratingCount":S.ratingCount,"bestRating":"5","worstRating":"1"},
     "sameAs":S.links.map(l => l.url).concat(S.maps),
     "hasOfferCatalog":{"@type":"OfferCatalog","name":"Услуги и цены","itemListElement":S.services.map(x => ({"@type":"Offer","itemOffered":{"@type":"Service","name":x.name},"price":String(num(x.price)),"priceCurrency":"RUB"}))},
     "potentialAction":{"@type":"ReserveAction","target":{"@type":"EntryPoint","urlTemplate":S.booking,"inLanguage":"ru-RU","actionPlatform":["https://schema.org/DesktopWebPlatform","https://schema.org/MobileWebPlatform"]},"result":{"@type":"Reservation","name":"Запись в " + fullName}}},
    {"@type":"FAQPage","@id":S.siteUrl + "#faq","mainEntity":S.faq.map(f => ({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))}
  ]};
  document.getElementById("ld").textContent = JSON.stringify(graph);
  document.title = S.seoTitle;

  // открыто ли сейчас (время города)
  let nowMin;
  try {
    const parts = new Intl.DateTimeFormat("ru-RU", { timeZone: S.timeZone, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    nowMin = Number(parts.find(x => x.type === "hour").value) % 24 * 60 + Number(parts.find(x => x.type === "minute").value);
  } catch (err) { const d = new Date(); nowMin = ((d.getUTCHours() + 3) % 24) * 60 + d.getUTCMinutes(); }
  const oMin = H[0] * 60 + Number(H[1]), cMin = H[2] * 60 + Number(H[3]);
  const isOpen = nowMin >= oMin && nowMin < cMin;
  const status = isOpen ? "Открыто до " + closes : (nowMin < oMin ? "Откроется в " : "Откроется завтра в ") + opens;
  document.querySelectorAll("#open,.js-status").forEach(el => { el.textContent = status; el.classList.toggle("on", isOpen); });

  // живые отзывы Яндекса — только по нажатию
  const ywBtn = document.getElementById("ywBtn"), yw = document.getElementById("yw");
  ywBtn.addEventListener("click", () => {
    const f = yw.querySelector(".yw-f");
    if (!f.firstChild) f.innerHTML = `<iframe src="https://yandex.ru/maps-reviews-widget/${e(S.yandexOrgId)}?comments" title="Отзывы о барбершопе на Яндекс Картах" loading="lazy"></iframe>`;
    yw.hidden = false; ywBtn.setAttribute("aria-expanded", "true"); yw.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  document.getElementById("ywX").addEventListener("click", () => { yw.hidden = true; ywBtn.setAttribute("aria-expanded", "false"); ywBtn.focus(); });

  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".rv").forEach(el => io.observe(el));
    // липкая панель: после первого экрана и пока не видно другой кнопки записи и галереи работ
    const s = document.getElementById("sticky"), vis = new Set(); let past = false;
    const upd = () => s.classList.toggle("show", past && vis.size === 0);
    const bo = new IntersectionObserver(es => { es.forEach(x => x.isIntersecting ? vis.add(x.target) : vis.delete(x.target)); upd(); });
    document.querySelectorAll(".js-book,#gallery").forEach(b => bo.observe(b));
    new IntersectionObserver(es => { past = !es[0].isIntersecting; upd(); }).observe(document.getElementById("hero"));
  } else { document.querySelectorAll(".rv").forEach(el => el.classList.add("in")); }
})(SHOP);
</script>
</body>
</html>
